spring:
  application:
    name: logitrack-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logitrack}
    username: ${DB_USER:logitrack}
    password: ${DB_PASSWORD:logitrack}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    time-zone: America/Sao_Paulo
    deserialization:
      fail-on-unknown-properties: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logitrack:
  jwt:
    # Em produção, JWT_SECRET vem do .env (mínimo 32 caracteres). O padrão serve só para desenvolvimento local.
    secret: ${JWT_SECRET:desenvolvimento-local-segredo-com-mais-de-32-caracteres}
    expiracao: 8h
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}
