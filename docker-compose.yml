services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-logitrack}
      POSTGRES_USER: ${DB_USER:-logitrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logitrack}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logitrack} -d ${DB_NAME:-logitrack}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
